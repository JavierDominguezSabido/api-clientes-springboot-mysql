spring.application.name=api-clientes-springboot-mysql

# Conexión a MySQL: se configura con variables de entorno (con valores por defecto para desarrollo local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/api_clientes_db?useSSL=false&serverTimezone=Europe/Madrid&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${PORT:8080}
