services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: api_clientes_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-cambiame}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-cambiame}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/api_clientes_db?useSSL=false&serverTimezone=Europe/Madrid&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-cambiame}
    ports:
      - "8080:8080"

volumes:
  mysql-data:
